name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Backend — Build & Type Check
  # ─────────────────────────────────────────
  backend:
    name: 🔧 Backend — Build & Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendguard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeScript build
        working-directory: ./backend
        run: npm run build
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/spendguard_test
          JWT_SECRET: ci_test_secret
          EMAIL_ENABLED: "false"
          MONTHLY_REPORT_ENABLED: "false"
          FRONTEND_URL: "http://localhost:3000"
          MAX_FILE_SIZE: "5242880"
          ALLOWED_FILE_TYPES: "text/csv,application/vnd.ms-excel"

      - name: Verify dist output exists
        run: |
          echo "✅ Checking compiled output..."
          ls backend/dist/server.js
          echo "Build artifacts verified."

  # ─────────────────────────────────────────
  # JOB 2: Backend — Security Audit
  # ─────────────────────────────────────────
  audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend — npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Frontend — npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ─────────────────────────────────────────
  # JOB 3: Frontend — Build Check
  # ─────────────────────────────────────────
  frontend:
    name: 🎨 Frontend — Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Next.js build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  # ─────────────────────────────────────────
  # JOB 4: Summary — All checks passed
  # ─────────────────────────────────────────
  summary:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, audit]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "Backend  : ${{ needs.backend.result }}"
          echo "Frontend : ${{ needs.frontend.result }}"
          echo "Audit    : ${{ needs.audit.result }}"

          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "❌ Backend build failed"
            exit 1
          fi

          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Frontend build failed"
            exit 1
          fi

          echo "✅ All CI checks passed successfully!"
